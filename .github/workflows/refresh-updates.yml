name: Refresh official-source updates
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brainchain-updates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_updates.py
      - run: python scripts/refresh_updates.py
      - run: npm ci
      - run: npm run build
      - name: Save only validated updates
        run: |
          if git diff --quiet -- data/updates.json; then exit 0; fi
          git config user.name 'brainchain-updates[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/updates.json
          git commit -m 'Refresh validated official-source updates'
          git push
